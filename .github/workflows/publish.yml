name: Auto Publish to npm on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build
        run: |
          npm install
          cd packages/scrape-sdk
          npm install
          npm run build
          npm test

      - name: Publish to npm
        run: |
          cd packages/scrape-sdk
          CURRENT_VER=$(node -p "require('./package.json').version")
          
          # Check if this exact version already exists on npm
          if npm view "scrape-sdk@${CURRENT_VER}" version --json >/dev/null 2>&1; then
            echo "::notice ::Version ${CURRENT_VER} is already published on npm. Skipping duplicate publish."
          else
            echo "Publishing release version ${CURRENT_VER} to npm registry..."
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
