name: Auto Publish to npm on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build
        run: |
          npm install
          cd packages/scrape-sdk
          npm install
          npm run build
          npm test

      - name: Publish to npm
        run: |
          publish_if_new() {
            local dir="$1"
            local name
            name=$(node -p "require('./package.json').name")
            local ver
            ver=$(node -p "require('./package.json').version")
            if npm view "${name}@${ver}" version --json >/dev/null 2>&1; then
              echo "::notice ::${name}@${ver} already published. Skipping."
            else
              echo "Publishing ${name}@${ver}..."
              npm publish --access public
            fi
          }

          cd packages/scrape-sdk
          publish_if_new .
          cd ../mcp-server
          npm install
          NODE_OPTIONS=--max-old-space-size=4096 npm run build
          publish_if_new .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
