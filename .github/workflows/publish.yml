name: Auto Publish to npm on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build
        run: |
          npm install
          cd packages/scrape-sdk
          npm install
          npm run build
          npm test

      - name: Auto-Publish to npm on Every Commit
        run: |
          cd packages/scrape-sdk
          CURRENT_VER=$(node -p "require('./package.json').version")
          NPM_VER=$(npm view scrape-sdk version 2>/dev/null || echo "0.0.0")
          echo "Local version: $CURRENT_VER, NPM version: $NPM_VER"

          if [ "$CURRENT_VER" = "$NPM_VER" ]; then
            echo "Version already on npm. Auto-bumping patch version..."
            npm version patch --no-git-tag-version
          fi

          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
